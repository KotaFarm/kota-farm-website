<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A running record of life at Kovana Natural Farm — seedlings, harvests, trees, soil, and everything in between.">
    <title>Farm Diary | Kovana Natural Farm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232d3319'/%3E%3Cpath d='M16 6c-2 4-1 8 0 11 1-3 5-7 9-8-3 3-6 7-7 11 0 0-1 4-2 6-1-2-2-6-2-6-1-4-4-8-7-11 4 1 8 5 9 8C17 14 18 10 16 6z' fill='%23a8c686'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site-nav.css">
    <link rel="stylesheet" href="css/practice.css">
    <script src="js/vercel-analytics.js" defer></script>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        .fd-header {
            background: var(--sand);
            padding: 4rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(139,152,98,0.25);
        }
        .fd-header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
        }
        .fd-header p {
            color: var(--earth-medium);
            font-size: 1rem;
            font-weight: 300;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Container */
        .fd-timeline {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* Month header */
        .fd-month {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--earth-dark);
            margin: 2.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--sprout);
            display: inline-block;
        }
        .fd-month:first-child { margin-top: 0; }

        /* Tile grid */
        .fd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        /* Individual tile */
        .fd-tile {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            background: white;
            box-shadow: 0 2px 10px rgba(45,51,25,0.07);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .fd-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(45,51,25,0.12);
        }
        .fd-tile-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            display: block;
            background: var(--sand);
        }
        .fd-tile-noimg {
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, var(--sand), rgba(168,198,134,0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }
        .fd-tile-body {
            padding: 0.6rem 0.75rem 0.7rem;
        }
        .fd-tile-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--earth-dark);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .fd-tile-meta {
            font-size: 0.72rem;
            color: var(--earth-light);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .fd-tile-tag {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--water);
            background: rgba(107,144,128,0.12);
            padding: 0.12rem 0.4rem;
            border-radius: 6px;
        }

        /* Expanded detail overlay */
        .fd-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45,51,25,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .fd-overlay.open {
            display: flex;
        }
        .fd-modal {
            background: white;
            border-radius: 14px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 12px 40px rgba(45,51,25,0.2);
            position: relative;
        }
        .fd-modal-close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(45,51,25,0.7);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            line-height: 1;
        }
        .fd-modal-close:hover { background: rgba(45,51,25,0.9); }
        .fd-modal-img {
            width: 100%;
            max-height: 380px;
            object-fit: cover;
            display: block;
            border-radius: 14px 14px 0 0;
        }
        .fd-modal-body {
            padding: 1.25rem 1.5rem 1.5rem;
        }
        .fd-modal-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.3rem;
        }
        .fd-modal-meta {
            font-size: 0.8rem;
            color: var(--earth-light);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .fd-modal-note {
            font-size: 0.92rem;
            color: var(--earth-medium);
            line-height: 1.7;
        }

        /* Collapsed month card (past months) */
        .fd-month-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            margin: 1.5rem 0 0.5rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 12px rgba(45,51,25,0.07);
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            border-left: 4px solid var(--earth-light);
        }
        .fd-month-card:first-child { margin-top: 0; }
        .fd-month-card:hover {
            background: rgba(168, 198, 134, 0.06);
            box-shadow: 0 4px 18px rgba(45,51,25,0.1);
        }
        .fd-month-card[data-expanded="true"] {
            border-left-color: var(--sprout);
            margin-bottom: 0.75rem;
        }
        .fd-month-card-count {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--sand);
            color: var(--earth-dark);
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .fd-month-card-body { flex: 1; min-width: 0; }
        .fd-month-card-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--earth-dark);
        }
        .fd-month-card-summary {
            font-size: 0.82rem;
            color: var(--earth-medium);
            margin-top: 0.2rem;
            line-height: 1.5;
        }
        .fd-month-card-tags {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }
        .fd-row-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--water);
            background: rgba(107,144,128,0.12);
            padding: 0.15rem 0.45rem;
            border-radius: 8px;
        }
        .fd-month-card-chevron {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            color: var(--earth-light);
            transition: transform 0.3s ease;
        }
        .fd-month-card[data-expanded="true"] .fd-month-card-chevron {
            transform: rotate(90deg);
        }

        /* Month content (hidden for past months) */
        .fd-month-content {
            display: none;
            padding-left: 0;
        }
        .fd-month-content.open {
            display: block;
        }

        /* Tag emoji map */
        .fd-tile-noimg[data-tag="infra"]::after { content: '\1F527'; }
        .fd-tile-noimg[data-tag="planting"]::after { content: '\1F331'; }
        .fd-tile-noimg[data-tag="milestone"]::after { content: '\1F389'; }
        .fd-tile-noimg[data-tag="harvest"]::after { content: '\1F33E'; }
        .fd-tile-noimg[data-tag="farm"]::after { content: '\1F333'; }

        /* Empty state */
        .fd-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--earth-light);
            font-size: 1rem;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .fd-timeline { padding: 1.5rem 1rem 3rem; }
            .fd-grid { grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
            .fd-tile-img { height: 110px; }
            .fd-tile-body { padding: 0.5rem 0.6rem 0.6rem; }
            .fd-tile-title { font-size: 0.78rem; }
            .fd-modal { border-radius: 12px; }
            .fd-modal-img { max-height: 260px; }
            .fd-modal-body { padding: 1rem 1.25rem 1.25rem; }
            .fd-month-card { padding: 0.75rem 1rem; gap: 0.75rem; }
        }
    </style>
</head>

<div class="fd-header">
    <h1>Farm Diary</h1>
    <p>A running record of life on the farm — what's growing, what's changing, what we're learning.</p>
</div>

<div class="fd-timeline" id="fd-timeline">
    <p class="fd-empty">Loading farm updates&hellip;</p>
</div>

<!-- Detail modal -->
<div class="fd-overlay" id="fd-overlay">
    <div class="fd-modal" id="fd-modal">
        <button class="fd-modal-close" id="fd-modal-close" aria-label="Close">&times;</button>
        <div id="fd-modal-content"></div>
    </div>
</div>

<script src="diary-config.js?v=20260506"></script>
<script>
(function () {
    var timeline = document.getElementById('fd-timeline');
    var overlay = document.getElementById('fd-overlay');
    var modal = document.getElementById('fd-modal');
    var modalContent = document.getElementById('fd-modal-content');
    var modalClose = document.getElementById('fd-modal-close');
    if (!timeline) return;

    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

    function monthKey(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})/);
        return m ? m[1] + '-' + m[2] : 'unknown';
    }

    function monthLabel(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})/);
        if (!m) return 'Updates';
        return MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1];
    }

    function dayLabel(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (!m) return '';
        return MONTHS[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10);
    }

    function groupByMonth(entries) {
        var months = [];
        var map = {};
        entries.forEach(function (e) {
            var k = monthKey(e._dateIso);
            if (!map[k]) {
                map[k] = { key: k, label: monthLabel(e._dateIso), entries: [] };
                months.push(map[k]);
            }
            map[k].entries.push(e);
        });
        return months;
    }

    function isCurrentMonth(key) {
        var now = new Date();
        var cur = now.getFullYear() + '-' + (now.getMonth() + 1);
        return key === cur;
    }

    function autoSummary(entries) {
        var summaryEntry = null;
        var regular = [];
        entries.forEach(function (e) {
            if (e.tag === 'summary') { summaryEntry = e; }
            else { regular.push(e); }
        });
        if (summaryEntry && summaryEntry.note) return summaryEntry.note;

        var tagCounts = {};
        regular.forEach(function (e) {
            tagCounts[e.tag] = (tagCounts[e.tag] || 0) + 1;
        });
        var parts = [];
        for (var t in tagCounts) {
            parts.push(tagCounts[t] + ' ' + t);
        }
        return regular.length + ' update' + (regular.length !== 1 ? 's' : '') + ' — ' + parts.join(', ');
    }

    // Modal
    function openModal(entry) {
        modalContent.innerHTML =
            (entry.photo ? '<img class="fd-modal-img" src="' + entry.photo + '" alt="' + entry.title + '">' : '') +
            '<div class="fd-modal-body">' +
                '<div class="fd-modal-title">' + entry.title + '</div>' +
                '<div class="fd-modal-meta">' +
                    '<span class="fd-tile-tag">' + entry.tag + '</span>' +
                    '<span>' + (entry.date || dayLabel(entry._dateIso)) + '</span>' +
                '</div>' +
                (entry.note ? '<div class="fd-modal-note">' + entry.note + '</div>' : '') +
            '</div>';
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) {
        if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
    });

    // Build a tile
    function buildTile(entry) {
        var tile = document.createElement('div');
        tile.className = 'fd-tile';
        tile.innerHTML =
            (entry.photo
                ? '<img class="fd-tile-img" src="' + entry.photo + '" alt="' + entry.title + '" loading="lazy">'
                : '<div class="fd-tile-noimg" data-tag="' + entry.tag + '"></div>') +
            '<div class="fd-tile-body">' +
                '<div class="fd-tile-title">' + entry.title + '</div>' +
                '<div class="fd-tile-meta">' +
                    '<span class="fd-tile-tag">' + entry.tag + '</span>' +
                    '<span>' + dayLabel(entry._dateIso) + '</span>' +
                '</div>' +
            '</div>';
        tile.addEventListener('click', function () { openModal(entry); });
        return tile;
    }

    // Build a tile grid for a set of entries
    function buildGrid(entries) {
        var grid = document.createElement('div');
        grid.className = 'fd-grid';
        entries.forEach(function (e) {
            if (e.tag !== 'summary') grid.appendChild(buildTile(e));
        });
        return grid;
    }

    function toggleMonthCard(card) {
        var content = card.nextElementSibling;
        if (!content || !content.classList.contains('fd-month-content')) return;
        var open = content.classList.contains('open');
        content.classList.toggle('open');
        card.setAttribute('data-expanded', open ? 'false' : 'true');
    }

    function render() {
        if (typeof DIARY_ENTRIES === 'undefined') return;
        if (!DIARY_ENTRIES.length) {
            timeline.innerHTML = '<p class="fd-empty">Farm updates coming soon.</p>';
            return;
        }

        timeline.innerHTML = '';
        var months = groupByMonth(DIARY_ENTRIES);

        months.forEach(function (month) {
            var current = isCurrentMonth(month.key);
            var regular = month.entries.filter(function (e) { return e.tag !== 'summary'; });

            if (current) {
                var heading = document.createElement('div');
                heading.className = 'fd-month';
                heading.textContent = month.label;
                timeline.appendChild(heading);
                timeline.appendChild(buildGrid(regular));
            } else {
                var summary = autoSummary(month.entries);

                var tagSet = {};
                regular.forEach(function (e) { tagSet[e.tag] = true; });
                var tagHtml = '';
                for (var t in tagSet) {
                    tagHtml += '<span class="fd-row-tag">' + t + '</span>';
                }

                var card = document.createElement('div');
                card.className = 'fd-month-card';
                card.setAttribute('data-expanded', 'false');
                card.innerHTML =
                    '<div class="fd-month-card-count">' + regular.length + '</div>' +
                    '<div class="fd-month-card-body">' +
                        '<div class="fd-month-card-title">' + month.label + '</div>' +
                        '<div class="fd-month-card-summary">' + summary + '</div>' +
                        '<div class="fd-month-card-tags">' + tagHtml + '</div>' +
                    '</div>' +
                    '<svg class="fd-month-card-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7,4 13,10 7,16"/></svg>';
                card.addEventListener('click', function () { toggleMonthCard(card); });
                timeline.appendChild(card);

                var content = document.createElement('div');
                content.className = 'fd-month-content';
                content.appendChild(buildGrid(regular));
                timeline.appendChild(content);
            }
        });
    }

    if (typeof DIARY_ENTRIES !== 'undefined' && DIARY_ENTRIES.length) render();
    window.addEventListener('diary:loaded', render);
})();
</script>
