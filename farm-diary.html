<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A running record of life at Kovana Natural Farm — seedlings, harvests, trees, soil, and everything in between.">
    <title>Farm Diary | Kovana Natural Farm</title>

    <style>
        .fd-header {
            background: var(--sand);
            padding: 4rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(139,152,98,0.25);
        }
        .fd-header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
        }
        .fd-header p {
            color: var(--earth-medium);
            font-size: 1rem;
            font-weight: 300;
            max-width: 440px;
            margin: 0 auto;
        }

        /* Timeline container */
        .fd-timeline {
            max-width: 780px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        /* Month header */
        .fd-month {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--earth-dark);
            margin: 2.5rem 0 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--sprout);
            display: inline-block;
        }
        .fd-month:first-child {
            margin-top: 0;
        }

        /* Single entry row (compact) */
        .fd-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            margin: 0.35rem 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            border-left: 3px solid var(--earth-light);
        }
        .fd-row:hover {
            background: rgba(168, 198, 134, 0.1);
        }
        .fd-row[data-expanded="true"] {
            background: rgba(168, 198, 134, 0.08);
            border-left-color: var(--sprout);
        }
        .fd-row-thumb {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .fd-row-body {
            flex: 1;
            min-width: 0;
        }
        .fd-row-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--earth-dark);
            line-height: 1.3;
        }
        .fd-row-meta {
            font-size: 0.78rem;
            color: var(--earth-light);
            margin-top: 0.15rem;
        }
        .fd-row-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--water);
            background: rgba(107,144,128,0.12);
            padding: 0.15rem 0.45rem;
            border-radius: 8px;
            margin-right: 0.4rem;
        }
        .fd-row-chevron {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: var(--earth-light);
            transition: transform 0.25s ease;
        }
        .fd-row[data-expanded="true"] .fd-row-chevron {
            transform: rotate(90deg);
        }

        /* Expanded detail panel */
        .fd-detail {
            display: none;
            margin: 0 0 0.5rem 0.75rem;
            padding: 1rem;
            border-left: 3px solid var(--sprout);
            border-radius: 0 10px 10px 0;
            background: white;
            box-shadow: 0 2px 12px rgba(45,51,25,0.06);
        }
        .fd-detail.open {
            display: block;
        }
        .fd-detail-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            margin-bottom: 0.75rem;
        }
        .fd-detail-note {
            font-size: 0.9rem;
            color: var(--earth-medium);
            line-height: 1.7;
        }

        /* Cluster row — grouped entries */
        .fd-cluster {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.75rem;
            margin: 0.35rem 0;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
            border-left: 3px solid var(--water);
        }
        .fd-cluster:hover {
            background: rgba(107,144,128,0.08);
        }
        .fd-cluster[data-expanded="true"] {
            border-left-color: var(--sprout);
            background: rgba(168, 198, 134, 0.06);
        }
        .fd-cluster-badge {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--water);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .fd-cluster-body {
            flex: 1;
            min-width: 0;
        }
        .fd-cluster-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--earth-dark);
        }
        .fd-cluster-summary {
            font-size: 0.78rem;
            color: var(--earth-light);
            margin-top: 0.15rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Cluster expanded children */
        .fd-cluster-children {
            display: none;
            margin-left: 0.75rem;
            padding-left: 0;
        }
        .fd-cluster-children.open {
            display: block;
        }

        /* Collapsed month card (past months) */
        .fd-month-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            margin: 1.5rem 0 0.5rem;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 12px rgba(45,51,25,0.07);
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.2s ease;
            border-left: 4px solid var(--earth-light);
        }
        .fd-month-card:first-child { margin-top: 0; }
        .fd-month-card:hover {
            background: rgba(168, 198, 134, 0.06);
            box-shadow: 0 4px 18px rgba(45,51,25,0.1);
        }
        .fd-month-card[data-expanded="true"] {
            border-left-color: var(--sprout);
            margin-bottom: 0.75rem;
        }
        .fd-month-card-count {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--sand);
            color: var(--earth-dark);
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .fd-month-card-body { flex: 1; min-width: 0; }
        .fd-month-card-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--earth-dark);
        }
        .fd-month-card-summary {
            font-size: 0.82rem;
            color: var(--earth-medium);
            margin-top: 0.2rem;
            line-height: 1.5;
        }
        .fd-month-card-tags {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }
        .fd-month-card-chevron {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            color: var(--earth-light);
            transition: transform 0.3s ease;
        }
        .fd-month-card[data-expanded="true"] .fd-month-card-chevron {
            transform: rotate(90deg);
        }

        /* Month content (hidden for past months) */
        .fd-month-content {
            display: none;
            padding-left: 0.5rem;
        }
        .fd-month-content.open {
            display: block;
        }

        /* Empty state */
        .fd-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--earth-light);
            font-size: 1rem;
            font-weight: 300;
        }

        @media (max-width: 600px) {
            .fd-timeline { padding: 1.5rem 1rem 3rem; }
            .fd-row-thumb { width: 40px; height: 40px; }
            .fd-detail-img { max-height: 280px; }
            .fd-month-card { padding: 0.75rem 1rem; gap: 0.75rem; }
        }
    </style>

<div class="fd-header">
    <h1>Farm Diary</h1>
    <p>A running record of life on the farm — what's growing, what's changing, what we're learning.</p>
</div>

<div class="fd-timeline" id="fd-timeline">
    <p class="fd-empty">Loading farm updates&hellip;</p>
</div>

<footer class="practice-footer">
    <p>&copy; 2026 Kovana Natural Farm &middot; Khedli Pandya, Kota, Rajasthan</p>

<script src="diary-config.js?v=20260506"></script>
<script>
(function () {
    var timeline = document.getElementById('fd-timeline');
    if (!timeline) return;

    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

    var CHEVRON_SVG = '<svg class="fd-row-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7,4 13,10 7,16"/></svg>';

    function daysBetween(a, b) {
        var d1 = new Date(a), d2 = new Date(b);
        return Math.abs(Math.round((d1 - d2) / 86400000));
    }

    function monthKey(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})/);
        return m ? m[1] + '-' + m[2] : 'unknown';
    }

    function monthLabel(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})/);
        if (!m) return 'Updates';
        return MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1];
    }

    function dayLabel(iso) {
        var m = String(iso).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (!m) return '';
        return MONTHS[parseInt(m[2], 10) - 1] + ' ' + parseInt(m[3], 10);
    }

    function groupByMonth(entries) {
        var months = [];
        var map = {};
        entries.forEach(function (e) {
            var k = monthKey(e._dateIso);
            if (!map[k]) {
                map[k] = { key: k, label: monthLabel(e._dateIso), entries: [] };
                months.push(map[k]);
            }
            map[k].entries.push(e);
        });
        return months;
    }

    function clusterEntries(entries) {
        var items = [];
        var used = {};
        for (var i = 0; i < entries.length; i++) {
            if (used[i]) continue;
            var cluster = [entries[i]];
            used[i] = true;
            for (var j = i + 1; j < entries.length; j++) {
                if (used[j]) continue;
                if (entries[j].tag === entries[i].tag &&
                    daysBetween(entries[i]._dateIso, entries[j]._dateIso) <= 7) {
                    cluster.push(entries[j]);
                    used[j] = true;
                }
            }
            if (cluster.length >= 2) {
                items.push({ type: 'cluster', tag: entries[i].tag, entries: cluster });
            } else {
                items.push({ type: 'single', entry: entries[i] });
            }
        }
        return items;
    }

    function toggleRow(row) {
        var detail = row.nextElementSibling;
        if (!detail || !detail.classList.contains('fd-detail')) return;
        var open = detail.classList.contains('open');
        detail.classList.toggle('open');
        row.setAttribute('data-expanded', open ? 'false' : 'true');
    }

    function toggleCluster(clusterEl) {
        var children = clusterEl.nextElementSibling;
        if (!children || !children.classList.contains('fd-cluster-children')) return;
        var open = children.classList.contains('open');
        children.classList.toggle('open');
        clusterEl.setAttribute('data-expanded', open ? 'false' : 'true');
    }

    function buildSingleRow(entry) {
        var frag = document.createDocumentFragment();

        var row = document.createElement('div');
        row.className = 'fd-row';
        row.setAttribute('data-expanded', 'false');
        row.innerHTML =
            (entry.photo ? '<img class="fd-row-thumb" src="' + entry.photo + '" alt="" loading="lazy">' : '') +
            '<div class="fd-row-body">' +
                '<div class="fd-row-title">' + entry.title + '</div>' +
                '<div class="fd-row-meta">' +
                    '<span class="fd-row-tag">' + entry.tag + '</span>' +
                    dayLabel(entry._dateIso) +
                '</div>' +
            '</div>' +
            CHEVRON_SVG;
        row.addEventListener('click', function () { toggleRow(row); });
        frag.appendChild(row);

        var detail = document.createElement('div');
        detail.className = 'fd-detail';
        detail.innerHTML =
            (entry.photo ? '<img class="fd-detail-img" src="' + entry.photo + '" alt="' + entry.title + '" loading="lazy">' : '') +
            (entry.note ? '<div class="fd-detail-note">' + entry.note + '</div>' : '');
        frag.appendChild(detail);

        return frag;
    }

    function buildCluster(cluster) {
        var frag = document.createDocumentFragment();

        var titles = cluster.entries.map(function (e) { return e.title; });
        var summary = titles.join(' → ');

        var row = document.createElement('div');
        row.className = 'fd-cluster';
        row.setAttribute('data-expanded', 'false');
        row.innerHTML =
            '<div class="fd-cluster-badge">' + cluster.entries.length + '</div>' +
            '<div class="fd-cluster-body">' +
                '<div class="fd-cluster-title">' + cluster.tag + ' updates</div>' +
                '<div class="fd-cluster-summary">' + summary + '</div>' +
            '</div>' +
            CHEVRON_SVG;
        row.addEventListener('click', function () { toggleCluster(row); });
        frag.appendChild(row);

        var children = document.createElement('div');
        children.className = 'fd-cluster-children';
        cluster.entries.forEach(function (entry) {
            children.appendChild(buildSingleRow(entry));
        });
        frag.appendChild(children);

        return frag;
    }

    function isCurrentMonth(key) {
        var now = new Date();
        var cur = now.getFullYear() + '-' + (now.getMonth() + 1);
        return key === cur;
    }

    function autoSummary(entries) {
        var summaryEntry = null;
        var regular = [];
        entries.forEach(function (e) {
            if (e.tag === 'summary') { summaryEntry = e; }
            else { regular.push(e); }
        });
        if (summaryEntry && summaryEntry.note) return summaryEntry.note;

        var tagCounts = {};
        regular.forEach(function (e) {
            tagCounts[e.tag] = (tagCounts[e.tag] || 0) + 1;
        });
        var parts = [];
        for (var t in tagCounts) {
            parts.push(tagCounts[t] + ' ' + t);
        }
        return regular.length + ' update' + (regular.length !== 1 ? 's' : '') + ' — ' + parts.join(', ');
    }

    function buildMonthContent(month) {
        var content = document.createElement('div');
        content.className = 'fd-month-content';

        var regular = month.entries.filter(function (e) { return e.tag !== 'summary'; });
        var items = clusterEntries(regular);
        items.forEach(function (item) {
            if (item.type === 'cluster') {
                content.appendChild(buildCluster(item));
            } else {
                content.appendChild(buildSingleRow(item.entry));
            }
        });
        return content;
    }

    function toggleMonthCard(card) {
        var content = card.nextElementSibling;
        if (!content || !content.classList.contains('fd-month-content')) return;
        var open = content.classList.contains('open');
        content.classList.toggle('open');
        card.setAttribute('data-expanded', open ? 'false' : 'true');
    }

    function render() {
        if (typeof DIARY_ENTRIES === 'undefined') return;
        if (!DIARY_ENTRIES.length) {
            timeline.innerHTML = '<p class="fd-empty">Farm updates coming soon.</p>';
            return;
        }

        timeline.innerHTML = '';
        var months = groupByMonth(DIARY_ENTRIES);

        months.forEach(function (month) {
            var current = isCurrentMonth(month.key);
            var regular = month.entries.filter(function (e) { return e.tag !== 'summary'; });

            if (current) {
                var heading = document.createElement('div');
                heading.className = 'fd-month';
                heading.textContent = month.label;
                timeline.appendChild(heading);

                var items = clusterEntries(regular);
                items.forEach(function (item) {
                    if (item.type === 'cluster') {
                        timeline.appendChild(buildCluster(item));
                    } else {
                        timeline.appendChild(buildSingleRow(item.entry));
                    }
                });
            } else {
                var summary = autoSummary(month.entries);

                var tagSet = {};
                regular.forEach(function (e) { tagSet[e.tag] = true; });
                var tagHtml = '';
                for (var t in tagSet) {
                    tagHtml += '<span class="fd-row-tag">' + t + '</span>';
                }

                var card = document.createElement('div');
                card.className = 'fd-month-card';
                card.setAttribute('data-expanded', 'false');
                card.innerHTML =
                    '<div class="fd-month-card-count">' + regular.length + '</div>' +
                    '<div class="fd-month-card-body">' +
                        '<div class="fd-month-card-title">' + month.label + '</div>' +
                        '<div class="fd-month-card-summary">' + summary + '</div>' +
                        '<div class="fd-month-card-tags">' + tagHtml + '</div>' +
                    '</div>' +
                    '<svg class="fd-month-card-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><polyline points="7,4 13,10 7,16"/></svg>';
                card.addEventListener('click', function () { toggleMonthCard(card); });
                timeline.appendChild(card);

                var content = buildMonthContent(month);
                timeline.appendChild(content);
            }
        });
    }

    if (typeof DIARY_ENTRIES !== 'undefined' && DIARY_ENTRIES.length) render();
    window.addEventListener('diary:loaded', render);
})();
</script>
