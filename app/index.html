<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#5a7a3a">
    <title>Kovana Farm — Harvest Entry</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <header class="app-header">
        <div>
            <h1>🌾 Harvest Entry</h1>
            <span id="farmLabel" class="subtitle hidden"></span>
            <select id="farmSelect" class="farm-select hidden" aria-label="Farm"></select>
        </div>
        <div class="header-right">
            <span id="userEmail" class="user-email"></span>
            <button id="logoutBtn" class="icon-btn hidden" type="button" aria-label="Sign out">🚪</button>
            <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings">⚙️</button>
        </div>
    </header>

    <!-- Login (shown when not signed in) -->
    <section id="loginCard" class="card login-card hidden">
        <div class="login-emblem">🌾</div>
        <h2 class="login-title">Kovana Farm Manager</h2>
        <p class="login-sub">Harvest records · Kovana &amp; Miyawaki</p>

        <button id="googleBtn" class="google-btn" type="button">
            <svg class="google-logo" viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Sign in with Google</span>
        </button>

        <p id="loginMsg" class="msg"></p>
        <p class="login-note">Access is by invitation. Sign in with the Google account your farm admin added.</p>
    </section>

    <!-- Offline / pending banner -->
    <div id="netBanner" class="net-banner hidden"></div>

    <!-- Settings panel (hidden by default) -->
    <section id="settingsPanel" class="card settings hidden">
        <h2>Settings</h2>
        <label for="apiBase">API URL</label>
        <input type="url" id="apiBase" placeholder="http://localhost:3000">
        <label for="apiToken">Token</label>
        <textarea id="apiToken" rows="3" placeholder="Paste token here"></textarea>
        <button id="saveSettings" class="btn primary" type="button">Save</button>
        <p id="settingsMsg" class="msg"></p>
    </section>

    <!-- Entry form -->
    <main id="entryForm" class="card">

        <label for="harvestDate">Date</label>
        <input type="date" id="harvestDate">

        <label>Choose crop</label>
        <div id="cropGrid" class="crop-grid">
            <p class="msg" id="cropMsg">Loading crops…</p>
        </div>

        <label for="weightKg">Weight (kg)</label>
        <input type="number" id="weightKg" inputmode="decimal" step="0.05" min="0.01" placeholder="0.0">

        <label>Quality</label>
        <div id="qualityRow" class="quality-row"></div>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Small round variety, fresh"></textarea>

        <button id="saveBtn" class="btn primary big" type="button">✅ SAVE</button>
        <p id="saveMsg" class="msg"></p>
    </main>

    <!-- Today's entries -->
    <section class="card">
        <h2>Today's entries</h2>
        <ul id="todayList" class="today-list">
            <li class="muted">No entries yet</li>
        </ul>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
