    <style>
        /* ── Archive header ──────────────────────────────────── */
        .blog-archive-header {
            background: var(--sand);
            padding: 4rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(139, 152, 98, 0.25);
            position: relative;
        }
        .blog-archive-header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }
        .blog-archive-header p {
            color: var(--earth-medium);
            font-size: 1rem;
            font-weight: 300;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ── Year jump bar (sticky) ──────────────────────────── */
        .blog-year-nav {
            position: sticky;
            top: 54px; /* sits under the main nav */
            z-index: 40;
            background: rgba(245, 243, 239, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 152, 98, 0.22);
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.45rem;
            flex-wrap: wrap;
        }
        .blog-year-nav-label {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--earth-light);
            margin-right: 0.4rem;
        }
        .blog-year-nav a {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--earth-medium);
            text-decoration: none;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            border: 1px solid rgba(139, 152, 98, 0.25);
            background: rgba(255, 255, 255, 0.5);
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
        }
        .blog-year-nav a:hover {
            background: var(--sand);
            color: var(--earth-dark);
            border-color: rgba(139, 152, 98, 0.5);
            transform: translateY(-1px);
        }
        .blog-year-nav a.is-active {
            background: var(--earth-dark);
            color: #f5f3ef;
            border-color: var(--earth-dark);
        }

        /* ── Timeline layout ─────────────────────────────────── */
        .blog-timeline {
            max-width: 1100px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }

        .blog-year-section {
            scroll-margin-top: 110px; /* main nav + year bar */
        }
        .blog-year-section + .blog-year-section {
            margin-top: 3.5rem;
        }

        .blog-year-title {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 700;
            color: var(--earth-dark);
            letter-spacing: -0.01em;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .blog-year-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(139, 152, 98, 0.4), rgba(139, 152, 98, 0));
        }
        .blog-year-count {
            font-family: 'Work Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--earth-light);
            letter-spacing: 0.03em;
            margin: 0.4rem 0 2rem;
        }

        /* Month block — with subtle timeline rail */
        .blog-month-block {
            position: relative;
            padding-left: 2.5rem;
            margin-bottom: 2.75rem;
        }
        .blog-month-block:last-child {
            margin-bottom: 0;
        }
        .blog-month-block::before {
            content: '';
            position: absolute;
            left: 0.55rem;
            top: 1.25rem;
            bottom: -1rem;
            width: 2px;
            background: linear-gradient(to bottom, rgba(139, 152, 98, 0.5) 0%, rgba(139, 152, 98, 0.12) 100%);
        }
        .blog-month-block:last-child::before {
            background: linear-gradient(to bottom, rgba(139, 152, 98, 0.5) 0%, rgba(139, 152, 98, 0) 85%);
        }
        .blog-month-block::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0.35rem;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--leaf);
            border: 3px solid #f5f3ef;
            box-shadow: 0 0 0 1px rgba(139, 152, 98, 0.45);
        }

        .blog-month-title {
            font-family: 'Crimson Pro', serif;
            font-style: italic;
            font-weight: 600;
            font-size: 1.3rem;
            color: var(--earth-medium);
            margin: 0 0 1.1rem;
            letter-spacing: 0.005em;
        }
        .blog-month-title .blog-month-count {
            font-family: 'Work Sans', sans-serif;
            font-style: normal;
            font-weight: 500;
            font-size: 0.72rem;
            color: var(--earth-light);
            margin-left: 0.5rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .blog-month-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: 1.5rem;
        }

        /* ── Post card ───────────────────────────────────────── */
        .blog-archive-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 16px rgba(45, 51, 25, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .blog-archive-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 32px rgba(45, 51, 25, 0.14);
        }
        .blog-archive-img {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: var(--sand);
            position: relative;
        }
        .blog-archive-img-missing::after {
            content: '🌿';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0.35;
            background: linear-gradient(135deg, var(--sand) 0%, rgba(168, 198, 134, 0.4) 100%);
        }
        .blog-archive-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.45s ease;
        }
        .blog-archive-card:hover .blog-archive-img img {
            transform: scale(1.04);
        }
        .blog-archive-body {
            padding: 1.2rem 1.35rem 1.45rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .blog-archive-meta {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .blog-archive-tag {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--water);
            background: rgba(107, 144, 128, 0.12);
            padding: 0.22rem 0.6rem;
            border-radius: 10px;
        }
        .blog-archive-date {
            font-size: 0.78rem;
            color: var(--earth-light);
        }
        .blog-archive-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        .blog-archive-summary {
            font-size: 0.92rem;
            color: var(--earth-medium);
            line-height: 1.65;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        .blog-archive-read {
            font-size: 0.8rem;
            color: var(--leaf);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .blog-archive-read::after {
            content: ' →';
        }

        .blog-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--earth-light);
            font-size: 1rem;
            font-weight: 300;
        }

        /* ── Mobile ──────────────────────────────────────────── */
        @media (max-width: 640px) {
            .blog-year-nav {
                top: 48px;
                padding: 0.55rem 0.75rem;
            }
            .blog-year-nav-label {
                display: none;
            }
            .blog-month-block {
                padding-left: 1.5rem;
            }
            .blog-month-block::before {
                left: 0.22rem;
            }
            .blog-month-block::after {
                left: -0.1rem;
                top: 0.3rem;
                width: 10px;
                height: 10px;
                border-width: 2px;
            }
            .blog-year-section {
                scroll-margin-top: 96px;
            }
        }
    </style>

<script src="../blog-config.js"></script>
<script>
(function() {
    var MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
    var MONTH_INDEX = {};
    MONTHS.forEach(function(m, i) { MONTH_INDEX[m] = i; });

    function parsePostDate(dateStr) {
        // Examples:
        //   "April 20–21, 2026"   -> {year:2026, month:"April",  day:20}
        //   "March 2026"          -> {year:2026, month:"March",  day:1}
        //   "December 15, 2025"   -> {year:2025, month:"December",day:15}
        var yearMatch = dateStr.match(/\b(19\d{2}|20\d{2}|21\d{2})\b/);
        var year = yearMatch ? parseInt(yearMatch[1], 10) : 0;

        var monthName = null;
        for (var i = 0; i < MONTHS.length; i++) {
            if (dateStr.indexOf(MONTHS[i]) !== -1) { monthName = MONTHS[i]; break; }
        }

        var day = 1;
        if (monthName) {
            var afterMonth = dateStr.slice(dateStr.indexOf(monthName) + monthName.length);
            // \b ensures we don't accidentally grab "20" out of "2026" when
            // the post date is month-only (e.g. "March 2026").
            var d = afterMonth.match(/\b(\d{1,2})\b/);
            if (d) {
                var parsedDay = parseInt(d[1], 10);
                if (parsedDay >= 1 && parsedDay <= 31) day = parsedDay;
            }
        }

        return {
            year:     year,
            month:    monthName,
            monthIdx: monthName !== null ? MONTH_INDEX[monthName] : -1,
            day:      day
        };
    }

    function escapeHtml(s) {
        return String(s || '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    var timeline = document.getElementById('blog-timeline');
    var yearNav  = document.getElementById('blog-year-nav');

    if (typeof BLOG_POSTS === 'undefined' || !BLOG_POSTS || BLOG_POSTS.length === 0) {
        timeline.innerHTML = '<p class="blog-empty">New posts coming soon.</p>';
        yearNav.style.display = 'none';
        return;
    }

    // Parse + group: { year: { monthIdx: [posts] } }
    var groups = {};
    BLOG_POSTS.forEach(function(post, i) {
        var d = parsePostDate(post.date);
        post._parsed = d;
        post._originalIndex = i;
        if (!d.year || d.monthIdx < 0) return;      // skip unparseable
        if (!groups[d.year]) groups[d.year] = {};
        if (!groups[d.year][d.monthIdx]) groups[d.year][d.monthIdx] = [];
        groups[d.year][d.monthIdx].push(post);
    });

    var years = Object.keys(groups).map(Number).sort(function(a, b) { return b - a; });

    if (years.length === 0) {
        timeline.innerHTML = '<p class="blog-empty">New posts coming soon.</p>';
        yearNav.style.display = 'none';
        return;
    }

    // Sort posts within each month: newest day first; ties preserve config order
    years.forEach(function(y) {
        Object.keys(groups[y]).forEach(function(mi) {
            groups[y][mi].sort(function(a, b) {
                if (b._parsed.day !== a._parsed.day) return b._parsed.day - a._parsed.day;
                return a._originalIndex - b._originalIndex;
            });
        });
    });

    // ── Render year nav chips ─────────────────────────────
    // (Hide the whole bar when there's only one year — nothing to jump to.)
    if (years.length <= 1) {
        yearNav.style.display = 'none';
    } else {
        years.forEach(function(y) {
            var a = document.createElement('a');
            a.href = '#year-' + y;
            a.textContent = y;
            a.setAttribute('data-year', y);
            yearNav.appendChild(a);
        });
    }

    // ── Render timeline ───────────────────────────────────
    years.forEach(function(y) {
        var section = document.createElement('section');
        section.className = 'blog-year-section';
        section.id = 'year-' + y;

        var title = document.createElement('h2');
        title.className = 'blog-year-title';
        title.textContent = y;
        section.appendChild(title);

        // Post count for the year
        var yearPostCount = 0;
        var monthsInYear = Object.keys(groups[y]).map(Number).sort(function(a, b) { return b - a; });
        monthsInYear.forEach(function(mi) { yearPostCount += groups[y][mi].length; });

        var count = document.createElement('div');
        count.className = 'blog-year-count';
        count.textContent = yearPostCount + (yearPostCount === 1 ? ' post' : ' posts');
        section.appendChild(count);

        monthsInYear.forEach(function(mi) {
            var posts = groups[y][mi];

            var monthBlock = document.createElement('div');
            monthBlock.className = 'blog-month-block';

            var mTitle = document.createElement('h3');
            mTitle.className = 'blog-month-title';
            mTitle.innerHTML = escapeHtml(MONTHS[mi]) +
                '<span class="blog-month-count">' + posts.length + (posts.length === 1 ? ' post' : ' posts') + '</span>';
            monthBlock.appendChild(mTitle);

            var grid = document.createElement('div');
            grid.className = 'blog-month-grid';

            posts.forEach(function(post) {
                var card = document.createElement('a');
                card.className = 'blog-archive-card';
                var postUrl = post.href ? ('../' + post.href) : (post.slug + '.html');
                card.href = postUrl;
                var coverUrl = '../' + post.cover;
                var imgHtml = '<img src="' + escapeHtml(coverUrl) + '" alt="' + escapeHtml(post.title) + '" loading="lazy" ' +
                              'onerror="this.style.display=\'none\'; this.parentNode.classList.add(\'blog-archive-img-missing\');">';
                card.innerHTML =
                    '<div class="blog-archive-img">' + imgHtml + '</div>' +
                    '<div class="blog-archive-body">' +
                        '<div class="blog-archive-meta">' +
                            '<span class="blog-archive-tag">' + escapeHtml(post.tag) + '</span>' +
                            '<span class="blog-archive-date">' + escapeHtml(post.date) + '</span>' +
                            (post.readingTime ? '<span class="blog-archive-date">· ' + escapeHtml(post.readingTime) + '</span>' : '') +
                        '</div>' +
                        '<div class="blog-archive-title">' + escapeHtml(post.title) + '</div>' +
                        '<div class="blog-archive-summary">' + escapeHtml(post.summary) + '</div>' +
                        '<div class="blog-archive-read">Read post</div>' +
                    '</div>';
                grid.appendChild(card);
            });

            monthBlock.appendChild(grid);
            section.appendChild(monthBlock);
        });

        timeline.appendChild(section);
    });

    // ── Highlight active year chip on scroll ──────────────
    if (years.length > 1 && 'IntersectionObserver' in window) {
        var chips = {};
        Array.prototype.forEach.call(yearNav.querySelectorAll('a[data-year]'), function(a) {
            chips[a.getAttribute('data-year')] = a;
        });
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (!entry.isIntersecting) return;
                var y = entry.target.id.replace('year-', '');
                Object.keys(chips).forEach(function(k) { chips[k].classList.remove('is-active'); });
                if (chips[y]) chips[y].classList.add('is-active');
            });
        }, { rootMargin: '-120px 0px -60% 0px', threshold: 0 });

        Array.prototype.forEach.call(document.querySelectorAll('.blog-year-section'), function(sec) {
            observer.observe(sec);
        });
    }
})();
</script>
