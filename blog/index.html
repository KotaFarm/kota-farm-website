<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stories, lessons, and reflections from Kota Natural Farm — a regenerative permaculture farm near Kota, Rajasthan.">
    <title>Blog | Kota Natural Farm</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%232d3319'/%3E%3Cpath d='M16 6c-2 4-1 8 0 11 1-3 5-7 9-8-3 3-6 7-7 11 0 0-1 4-2 6-1-2-2-6-2-6-1-4-4-8-7-11 4 1 8 5 9 8C17 14 18 10 16 6z' fill='%23a8c686'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/practice.css">
    <style>
        .blog-archive-header {
            background: var(--sand);
            padding: 4rem 2rem 3rem;
            text-align: center;
            border-bottom: 1px solid rgba(139, 152, 98, 0.25);
        }
        .blog-archive-header h1 {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
        }
        .blog-archive-header p {
            color: var(--earth-medium);
            font-size: 1rem;
            font-weight: 300;
            max-width: 520px;
            margin: 0 auto;
        }

        .blog-archive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 1.75rem;
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .blog-archive-card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 16px rgba(45, 51, 25, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .blog-archive-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 28px rgba(45, 51, 25, 0.14);
        }
        .blog-archive-img {
            aspect-ratio: 16 / 10;
            overflow: hidden;
            background: var(--sand);
            position: relative;
        }
        .blog-archive-img-missing::after {
            content: '🌿';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            opacity: 0.35;
            background: linear-gradient(135deg, var(--sand) 0%, rgba(168,198,134,0.4) 100%);
        }
        .blog-archive-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .blog-archive-card:hover .blog-archive-img img {
            transform: scale(1.04);
        }
        .blog-archive-body {
            padding: 1.25rem 1.35rem 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .blog-archive-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }
        .blog-archive-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--water);
            background: rgba(107, 144, 128, 0.12);
            padding: 0.22rem 0.6rem;
            border-radius: 10px;
        }
        .blog-archive-date {
            font-size: 0.78rem;
            color: var(--earth-light);
        }
        .blog-archive-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        .blog-archive-summary {
            font-size: 0.92rem;
            color: var(--earth-medium);
            line-height: 1.65;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        .blog-archive-read {
            font-size: 0.82rem;
            color: var(--leaf);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .blog-archive-read::after {
            content: ' →';
        }

        .blog-empty {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--earth-light);
            font-size: 1rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

<nav class="practice-nav">
    <div class="practice-nav-inner">
        <a href="../index.html" class="practice-nav-back" aria-label="Back to home">&larr;</a>
        <a href="../index.html" class="practice-nav-logo">Kota Natural Farm</a>
    </div>
</nav>

<div class="blog-archive-header">
    <h1>Blog</h1>
    <p>Stories, lessons, and reflections from life on a regenerative farm in Kota.</p>
</div>

<div class="blog-archive-grid" id="blog-archive-grid">
    <!-- Populated by JS from blog-config.js -->
</div>

<footer class="practice-footer">
    <p>&copy; 2026 Kota Natural Farm &middot; Khedli Pandya, Kota, Rajasthan</p>
</footer>

<script src="../blog-config.js"></script>
<script>
(function() {
    var grid = document.getElementById('blog-archive-grid');
    if (!grid || typeof BLOG_POSTS === 'undefined' || BLOG_POSTS.length === 0) {
        grid.innerHTML = '<p class="blog-empty">New posts coming soon.</p>';
        return;
    }
    BLOG_POSTS.forEach(function(post) {
        var card = document.createElement('a');
        card.className = 'blog-archive-card';
        // Build href: use post.href if provided, otherwise blog/<slug>.html
        // All paths are resolved relative to the site root (we're in /blog/ so we prepend "../")
        var postUrl = post.href ? ('../' + post.href) : (post.slug + '.html');
        card.href = postUrl;
        var coverUrl = '../' + post.cover;
        // Fallback if the cover image is missing — hide the broken icon and show an earthy placeholder
        var imgHtml = '<img src="' + coverUrl + '" alt="' + post.title + '" loading="lazy" ' +
                      'onerror="this.style.display=\'none\'; this.parentNode.classList.add(\'blog-archive-img-missing\');">';
        card.innerHTML =
            '<div class="blog-archive-img">' + imgHtml + '</div>' +
            '<div class="blog-archive-body">' +
                '<div class="blog-archive-meta">' +
                    '<span class="blog-archive-tag">' + post.tag + '</span>' +
                    '<span class="blog-archive-date">' + post.date + '</span>' +
                    (post.readingTime ? '<span class="blog-archive-date">· ' + post.readingTime + '</span>' : '') +
                '</div>' +
                '<div class="blog-archive-title">' + post.title + '</div>' +
                '<div class="blog-archive-summary">' + post.summary + '</div>' +
                '<div class="blog-archive-read">Read post</div>' +
            '</div>';
        grid.appendChild(card);
    });
})();
</script>
</body>
</html>
